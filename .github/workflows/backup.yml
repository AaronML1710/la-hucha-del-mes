# Copia de seguridad semanal de la base de datos de Supabase.
# Necesita dos secretos del repositorio:
#   SUPABASE_DB_URL    cadena de conexión "Session pooler" de Supabase (con la contraseña de la base de datos)
#   BACKUP_PASSPHRASE  frase con la que se cifra la copia (guárdala: sin ella no se puede abrir)
# Cada copia queda 90 días en Actions > Copia de seguridad semanal > (ejecución) > Artifacts.
# Para abrirla:  gpg -d hucha-backup-AAAA-MM-DD.tar.gz.gpg > copia.tar.gz  y  tar -xzf copia.tar.gz
name: Copia de seguridad semanal

on:
  schedule:
    - cron: '0 3 * * 1' # cada lunes a las 03:00 UTC (05:00 en España en verano, 04:00 en invierno)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Instalar pg_dump 17
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17

      - name: Volcar la base de datos
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          test -n "$DB_URL" || { echo "Falta el secreto SUPABASE_DB_URL"; exit 1; }
          PG=/usr/lib/postgresql/17/bin
          mkdir backup
          # Tablas de la web (cuentas, invitaciones y datos cifrados de cada usuario)
          $PG/pg_dump "$DB_URL" --schema=public --no-owner --no-privileges -f backup/public.sql
          # Usuarios de Supabase Auth, necesarios para poder iniciar sesión tras restaurar
          $PG/pg_dump "$DB_URL" --data-only --table=auth.users --table=auth.identities -f backup/auth-users.sql
          ls -la backup

      - name: Cifrar la copia
        env:
          PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          set -euo pipefail
          test -n "$PASSPHRASE" || { echo "Falta el secreto BACKUP_PASSPHRASE"; exit 1; }
          name="hucha-backup-$(date -u +%Y-%m-%d)"
          tar -czf "$name.tar.gz" backup
          gpg --batch --yes --pinentry-mode loopback --passphrase "$PASSPHRASE" --symmetric --cipher-algo AES256 -o "$name.tar.gz.gpg" "$name.tar.gz"
          rm -rf backup "$name.tar.gz"
          echo "NAME=$name" >> "$GITHUB_ENV"

      - name: Guardar la copia
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.NAME }}
          path: ${{ env.NAME }}.tar.gz.gpg
          retention-days: 90
          if-no-files-found: error
