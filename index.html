<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>La Hucha del Mes</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&family=IBM+Plex+Sans:wght@400;600&display=swap">
<style>
:root { --bg: #EDF1F4; --surface: #FFFFFF; --surface-2: #F5F8FA; --ink: #12202E; --muted: #5A6878; --line: #D8E0E7; --accent: #0E7C7B; --accent-soft: #D6EEEC; --on-accent: #FFFFFF; --bad: #C2372D; color-scheme: light; }
@media (prefers-color-scheme: dark) { :root { --bg: #0E141B; --surface: #161E28; --surface-2: #1C2632; --ink: #E6ECF2; --muted: #93A1B2; --line: #283443; --accent: #3CC2BF; --accent-soft: #143A3B; --on-accent: #06201F; --bad: #F06A5E; color-scheme: dark; } }
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 "IBM Plex Sans", "Segoe UI", system-ui, sans-serif; display: grid; place-items: center; padding: max(16px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(16px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left)); }
[hidden] { display: none !important; }
.card { width: min(380px, 100%); background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 24px; display: grid; gap: 16px; box-shadow: 0 4px 24px rgba(18,32,46,.08); }
.brand { display: flex; align-items: center; gap: 10px; font: 800 1.25rem "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif; }
p { margin: 0; color: var(--muted); font-size: .9rem; }
form { display: grid; gap: 12px; }
label { font-size: .8rem; font-weight: 600; color: var(--muted); display: grid; gap: 5px; }
input { font: inherit; color: inherit; width: 100%; border: 1px solid var(--line); background: var(--surface-2); border-radius: 10px; padding: 10px 12px; }
input:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 3px var(--accent-soft); }
button { font: inherit; font-weight: 600; border: 0; border-radius: 10px; padding: 12px; background: var(--accent); color: var(--on-accent); cursor: pointer; }
button:disabled { opacity: .6; cursor: progress; }
.err { color: var(--bad); min-height: 1.3em; font-size: .85rem; }
</style>
</head>
<body>
<main class="card">
  <div class="brand"><svg width="28" height="28" viewBox="0 0 28 28" aria-hidden="true"><rect x="2" y="7" width="24" height="17" rx="6" fill="var(--accent)"/><rect x="10" y="4" width="8" height="3" rx="1.5" fill="var(--ink)"/><circle cx="20" cy="14" r="1.6" fill="var(--on-accent)"/><rect x="8" y="12" width="7" height="2" rx="1" fill="var(--on-accent)"/></svg>La Hucha del Mes</div>
  <p>Acceso restringido. Escribe el usuario y la contraseña de acceso.</p>
  <form id="gate" novalidate>
    <label>Usuario<input id="u" autocomplete="username" autocapitalize="off" spellcheck="false"></label>
    <label>Contraseña<input id="p" type="password" autocomplete="current-password"></label>
    <div class="err" id="err" role="alert"></div>
    <button id="go" type="submit">Entrar</button>
  </form>
</main>

  const te = new TextEncoder();
  const unb64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  const b64 = b => btoa(String.fromCharCode.apply(null, new Uint8Array(b)));
  const SS = 'hucha.gate', KEEP_MS = 48 * 3600 * 1000; // el acceso se recuerda 48 horas en este navegador
  const forget = () => { try { localStorage.removeItem(SS); } catch {} };

  async function open(bits) {
    const encKey = await crypto.subtle.importKey('raw', bits.slice(0, 32), 'AES-CBC', false, ['decrypt']);
    const macKey = await crypto.subtle.importKey('raw', bits.slice(32, 64), { name: 'HMAC', hash: 'SHA-256' }, false, ['verify']);
    const iv = unb64(PAYLOAD.iv), ct = unb64(PAYLOAD.ct);
    const signed = new Uint8Array(iv.length + ct.length); signed.set(iv); signed.set(ct, iv.length);
    if (!await crypto.subtle.verify('HMAC', macKey, unb64(PAYLOAD.mac), signed)) throw new Error('bad');
    const html = new TextDecoder().decode(await crypto.subtle.decrypt({ name: 'AES-CBC', iv }, encKey, ct));
    // Mientras el navegador sigue cargando esta página, document.open() se ignora y la web se añadiría debajo
    await loaded;
    await new Promise(r => setTimeout(r, 0));
    document.open(); document.write(html); document.close();
  }
  const loaded = new Promise(r => document.readyState === 'complete' ? r() : addEventListener('load', () => r(), { once: true }));
  const card = document.querySelector('.card');
  async function derive(user, pass) {
    const base = await crypto.subtle.importKey('raw', te.encode(user + '\n' + pass), 'PBKDF2', false, ['deriveBits']);
    return new Uint8Array(await crypto.subtle.deriveBits({ name: 'PBKDF2', salt: unb64(PAYLOAD.salt), iterations: PAYLOAD.iter, hash: 'SHA-256' }, base, 512));
  }

  if (!window.crypto || !crypto.subtle) { document.getElementById('err').textContent = 'Este navegador no puede abrir la web. Usa uno actualizado.'; return; }
  try {
    const saved = JSON.parse(localStorage.getItem(SS) || 'null');
    if (saved && saved.exp > Date.now() && saved.salt === PAYLOAD.salt) {
      card.hidden = true; // acceso recordado: no enseñar el formulario mientras se abre
      open(unb64(saved.bits)).catch(() => { forget(); card.hidden = false; document.getElementById('u').focus(); });
    } else forget();
  } catch { forget(); }

  document.getElementById('gate').addEventListener('submit', async e => {
    e.preventDefault();
    const btn = document.getElementById('go'), err = document.getElementById('err');
    const user = document.getElementById('u').value.trim(), pass = document.getElementById('p').value;
    if (!user || !pass) { err.textContent = 'Escribe el usuario y la contraseña.'; return; }
    btn.disabled = true; btn.textContent = 'Comprobando…'; err.textContent = '';
    try {
      const bits = await derive(user, pass);
      try { localStorage.setItem(SS, JSON.stringify({ bits: b64(bits), salt: PAYLOAD.salt, exp: Date.now() + KEEP_MS })); } catch {}
      await open(bits);
    } catch {
      forget();
      err.textContent = 'Usuario o contraseña incorrectos.';
      btn.disabled = false; btn.textContent = 'Entrar';
      document.getElementById('p').value = ''; document.getElementById('p').focus();
    }
  });
  document.getElementById('u').focus();
})();
